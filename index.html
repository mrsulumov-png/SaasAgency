<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Анита — Dune Estate</title>

<style>
:root{
  --brand:#47060C;
  --bg:#f5f3f2;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  background:var(--bg);
}

.shell{
  max-width:560px;
  margin:0 auto;
}

/* ANIMATION LOAD */
.fadeUp{
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp .6s ease forwards;
}
.delay1{animation-delay:.2s}
.delay2{animation-delay:.3s}

@keyframes fadeUp{
  to{opacity:1;transform:none;}
}

/* iOS TAP */
a, .btn, .save, button{
  transition:all .15s ease;
}
a:active, .btn:active, .save:active{
  transform:scale(.95);
  opacity:.8;
}

/* HERO */
.hero{
  background:
    linear-gradient(rgba(71,6,12,.55), rgba(71,6,12,.55)),
    url('bg.jpg') center/cover no-repeat;
  color:#fff;
  padding:30px 20px 25px;
  text-align:center;
  position:relative;
}

/* INSTAGRAM */
.home{
  position:absolute;
  top:12px;
  left:12px;
  width:42px;height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  display:flex;
  align-items:center;
  justify-content:center;
}
.home img{width:20px}

/* LANG */
.lang{
  position:absolute;
  top:12px;
  right:12px;
  display:flex;
  background:rgba(255,255,255,.2);
  border-radius:999px;
}
.lang button{
  border:none;
  background:none;
  color:#fff;
  padding:6px 12px;
  font-weight:700;
  cursor:pointer;
}
.lang .active{
  background:#fff;
  color:#47060C;
  border-radius:999px;
}

/* AVATAR */
.avatar{
  width:100px;height:100px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
}

/* TEXT */
h1{color:#fff;margin:15px 0 5px}
.subtitle{color:#fff;font-size:14px}

/* ACTIONS */
.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.actions a{
  flex:1;
  padding:12px;
  border-radius:14px;
  background:rgba(255,255,255,.15);
  text-decoration:none;
  color:#fff;
  font-weight:800;
  text-align:center;
}

/* CARD + SAVE = ОДИН БЛОК */
.block{
  background:#fff;
  margin:16px;
  border-radius:16px;
  box-shadow:0 15px 35px rgba(0,0,0,.12);
  overflow:hidden;
}

.row{
  padding:16px;
  border-top:1px solid #eee;
}
.row:first-child{border:none}

.value{font-weight:700}
.label{font-size:12px;color:#777;margin-top:4px}

/* PROJECTS */
.projects{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
}
.projects.open{
  max-height:200px;
}
.projects a{
  display:block;
  padding:8px 0;
  color:#47060C;
  text-decoration:none;
}

/* BUTTONS */
.btnRow{
  display:flex;
  gap:10px;
  padding:12px 16px;
}
.btn{
  flex:1;
  padding:12px;
  border-radius:14px;
  background:#47060C;
  color:#D5BEB2;
  font-weight:900;
  text-align:center;
  box-shadow:0 6px 12px rgba(0,0,0,.15);
}
.btn.tg{background:#6E1A22}

/* SAVE */
.saveWrap{
  padding:10px 16px 16px;
}
.save{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px;
  border-radius:14px;
  border:1px solid #e5e5e5;
  font-weight:900;
}
</style>
</head>

<body>

<div class="shell">

<div class="hero fadeUp">

<a class="home" href="https://www.instagram.com/_anitatam" target="_blank">
<img src="insta.png">
</a>

<div class="lang">
<button id="ruBtn" class="active" onclick="setLang('ru')">RU</button>
<button id="enBtn" onclick="setLang('en')">EN</button>
</div>

<img src="anita.jpg" class="avatar">

<h1 id="name">Анита</h1>

<div class="subtitle" id="title">
Основатель и руководитель Dune Estate<br>
Недвижимость • ЧР • Дубай
</div>

<div class="actions">
<a href="#" id="call">ПОЗВОНИТЬ</a>
<a href="#">EMAIL</a>
<a href="#" id="catalog">КАТАЛОГ</a>
</div>

</div>

<div class="block fadeUp delay1">

<div class="row">
<div class="value">+7 999 123-45-67</div>
<div class="label" id="phoneLabel">Телефон</div>
</div>

<div class="row">
<div class="value">info@dunestate.com</div>
<div class="label" id="emailLabel">Email</div>
</div>

<div class="row">
<div class="value">dunestate.com</div>
<div class="label" id="siteLabel">Сайт</div>
</div>

<div class="row" onclick="toggleProjects()">
<div class="value" id="projectsTitle">Другие проекты ▾</div>

<div class="projects" id="projects">
<a href="#">Кухни и шкафы Мария</a>
<a href="#">Премиальная мебель Калинка</a>
</div>
</div>

<div class="btnRow">
<div class="btn">WHATSAPP</div>
<div class="btn tg">TELEGRAM</div>
</div>

<div class="saveWrap">
<div class="save" onclick="downloadContact()">👤 СОХРАНИТЬ КОНТАКТ</div>
</div>

</div>

</div>

<script>
function toggleProjects(){
const el=document.getElementById('projects');
el.classList.toggle('open');
}

function setLang(lang){
const ruBtn=document.getElementById('ruBtn');
const enBtn=document.getElementById('enBtn');

ruBtn.classList.remove('active');
enBtn.classList.remove('active');

if(lang==='en'){
enBtn.classList.add('active');

document.getElementById('name').innerText='Anita';
document.getElementById('title').innerHTML='Founder & CEO Dune Estate<br>Real Estate • Chechnya • Dubai';
document.getElementById('call').innerText='CALL';
document.getElementById('catalog').innerText='CATALOG';

document.getElementById('phoneLabel').innerText='Phone';
document.getElementById('emailLabel').innerText='Email';
document.getElementById('siteLabel').innerText='Website';
document.getElementById('projectsTitle').innerText='Other projects ▾';

}else{
ruBtn.classList.add('active');

document.getElementById('name').innerText='Анита';
document.getElementById('title').innerHTML='Основатель и руководитель Dune Estate<br>Недвижимость • ЧР • Дубай';
document.getElementById('call').innerText='ПОЗВОНИТЬ';
document.getElementById('catalog').innerText='КАТАЛОГ';

document.getElementById('phoneLabel').innerText='Телефон';
document.getElementById('emailLabel').innerText='Email';
document.getElementById('siteLabel').innerText='Сайт';
document.getElementById('projectsTitle').innerText='Другие проекты ▾';
}
}

function downloadContact(){
const vcard=`BEGIN:VCARD
VERSION:3.0
FN:Анита
TEL:+79991234567
EMAIL:info@dunestate.com
END:VCARD`;

const blob=new Blob([vcard],{type:'text/vcard'});
const link=document.createElement('a');
link.href=URL.createObjectURL(blob);
link.download='anita.vcf';
link.click();
}
</script>

</body>
</html>
