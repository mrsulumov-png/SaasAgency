<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Анита — Dune Estate</title>

<style>
:root{
  --brand:#47060C;
  --accent:#D5BEB2;
  --bg:#f5f3f2;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
}

.shell{
  max-width:560px;
  margin:0 auto;
}

/* HERO */
.hero{
  background:url('bg.jpg') center/cover no-repeat;
  color:#fff;
  padding:30px 20px;
  text-align:center;
  position:relative;
}

/* INSTAGRAM */
.home{
  position:absolute;
  top:12px;
  left:12px;
  width:42px;height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
}
.home img{width:20px}

/* LANG */
.lang{
  position:absolute;
  top:12px;
  right:12px;
  display:flex;
  background:rgba(255,255,255,.2);
  border-radius:999px;
}
.lang button{
  border:none;
  background:none;
  color:#fff;
  padding:6px 12px;
  font-weight:700;
  cursor:pointer;
}
.lang .active{
  background:#fff;
  color:#47060C;
  border-radius:999px;
}

/* AVATAR */
.avatar{
  width:100px;height:100px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #D5BEB2;
}

/* TEXT */
h1{
  color:#D5BEB2;
  margin:15px 0 5px;
}
.subtitle{
  color:#D5BEB2;
  font-size:14px;
  line-height:1.6;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.actions a{
  flex:1;
  padding:14px;
  border-radius:12px;
  background:rgba(255,255,255,.12);
  text-decoration:none;
  color:#fff;
  font-weight:800;
  text-align:center;
}

/* CARD */
.card{
  background:#fff;
  margin:16px 16px 40px;
  border-radius:16px;
  box-shadow:0 15px 35px rgba(0,0,0,.12);
}
.row{
  padding:16px;
  border-top:1px solid #eee;
}
.row:first-child{border:none}
.value{font-weight:700}
.label{
  font-size:12px;
  color:#777;
  margin-top:4px;
}

/* PROJECTS */
.projects{
  display:none;
  margin-top:10px;
}
.projects a{
  display:block;
  padding:8px 0;
  color:#47060C;
  text-decoration:none;
  font-weight:500;
}

/* BUTTONS */
.btnRow{
  display:flex;
  gap:10px;
  padding:16px;
}
.btn{
  flex:1;
  padding:14px;
  border-radius:12px;
  background:#47060C;
  color:#D5BEB2;
  font-weight:900;
  text-align:center;
}
.btn.tg{
  background:#6E1A22;
}

/* SAVE BUTTON (как на 2 фото) */
.save{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:0 16px 24px;
  padding:16px;
  border-radius:14px;
  border:1px solid #e5e5e5;
  font-weight:900;
  background:#fff;
  color:#222;
}
.save span{
  font-size:18px;
}
</style>
</head>

<body>

<div class="shell">

<div class="hero">

<a class="home" href="https://www.instagram.com/_anitatam?igsh=MnN2bXZvbWF0Nmc5" target="_blank">
<img src="insta.png">
</a>

<div class="lang">
<button onclick="setLang('ru')" class="active">RU</button>
<button onclick="setLang('en')">EN</button>
</div>

<img src="anita.jpg" class="avatar">

<h1 id="name">Анита</h1>

<div class="subtitle" id="title">
Основатель и руководитель Dune Estate<br>
Недвижимость • ЧР • Дубай
</div>

<div class="actions">
<a href="tel:+79991234567" id="call">ПОЗВОНИТЬ</a>
<a href="mailto:info@dunestate.com">EMAIL</a>
<a href="#" id="catalog">КАТАЛОГ</a>
</div>

</div>

<div class="card">

<div class="row">
<div class="value">+7 999 123-45-67</div>
<div class="label">Телефон</div>
</div>

<div class="row">
<div class="value">info@dunestate.com</div>
<div class="label">Email</div>
</div>

<div class="row">
<div class="value">dunestate.com</div>
<div class="label">Сайт</div>
</div>

<div class="row" onclick="toggleProjects()">
<div class="value">Другие проекты <span style="font-weight:400;">▾</span></div>

<div class="projects" id="projects">
<a href="https://www.instagram.com/kuhni_marya_grozny95?igsh=MTI4NjNicmUzOXA5ZA==" target="_blank">
Кухни и шкафы Мария
</a>
<a href="#" target="_blank">
Премиальная мебель Калинка
</a>
</div>
</div>

<div class="btnRow">
<div class="btn">WHATSAPP</div>
<div class="btn tg">TELEGRAM</div>
</div>

<div class="save">
👤 <span>СОХРАНИТЬ КОНТАКТ</span>
</div>

</div>

</div>

<script>
function toggleProjects(){
const el = document.getElementById('projects');
el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function setLang(lang){
if(lang==='en'){
document.getElementById('name').innerText='Anita';
document.getElementById('title').innerHTML='Founder & CEO Dune Estate<br>Real Estate • Chechnya • Dubai';
document.getElementById('call').innerText='CALL';
document.getElementById('catalog').innerText='CATALOG';
}else{
document.getElementById('name').innerText='Анита';
document.getElementById('title').innerHTML='Основатель и руководитель Dune Estate<br>Недвижимость • ЧР • Дубай';
document.getElementById('call').innerText='ПОЗВОНИТЬ';
document.getElementById('catalog').innerText='КАТАЛОГ';
}
}
</script>

</body>
</html>
